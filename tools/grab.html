<!doctype html><html><head><meta charset="utf-8"><title>grab</title></head><body><pre id="out">loading</pre>
<script>
// Dev helper: fetches CORS-enabled files and prints them as text so a scraper can read them.
var urls = [
"https://upload.wikimedia.org/wikipedia/commons/1/1e/Erlus-ag-logo.svg",
"https://upload.wikimedia.org/wikipedia/commons/8/87/Logo_Braas_Monier_RGB.svg",
"https://upload.wikimedia.org/wikipedia/commons/9/9b/Monier_Braas_logo.svg",
"https://upload.wikimedia.org/wikipedia/commons/3/32/Eternit_%C3%96sterreich_logo.svg",
"https://upload.wikimedia.org/wikipedia/commons/6/66/Eternit_Logo.svg",
"https://upload.wikimedia.org/wikipedia/commons/3/31/Wienerberger_logo.svg",
"https://upload.wikimedia.org/wikipedia/commons/e/e5/PREFA_Logo_2020.png",
"https://upload.wikimedia.org/wikipedia/commons/d/df/Rheinzink_logo_az.png",
"https://upload.wikimedia.org/wikipedia/commons/5/5b/Logo_Bramac_SK.gif"
];
Promise.all(urls.map(function (u) {
  return fetch(u).then(function (r) {
    var ct = r.headers.get("content-type") || "";
    if (ct.indexOf("svg") > -1) return r.text().then(function (t) { return { u: u, svg: t }; });
    return r.blob().then(function (b) { return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res({ u: u, data: fr.result }); }; fr.readAsDataURL(b); }); });
  }).catch(function (e) { return { u: u, err: String(e) }; });
})).then(function (all) { document.getElementById("out").textContent = "BEGIN" + btoa(unescape(encodeURIComponent(JSON.stringify(all)))) + "END"; });
</script></body></html>
